name: Cyrus Biotechnology
description: 'Cyrus Biotechnology is a Seattle-based protein-design and drug-discovery company building
  novel biologics for serious unmet medical needs by re-engineering existing proteins with a tight loop
  between computational modeling and lab testing. Its flagship product, Cyrus Bench, is a cloud-based
  protein modeling and structure-prediction platform that packages the Rosetta software suite (alongside
  deep-learning tools such as AlphaFold, OpenFold, RoseTTAFold and ProteinMPNN) behind a browser-based
  interface for homology modeling, protein/protein and enzyme/ligand interface design, protein stabilization,
  protein/ligand and protein/protein docking, and X-ray molecular replacement. Cyrus Bench is delivered as
  a hosted web application with user documentation rather than a public developer REST API; the company is
  backed by Trinity Ventures.'
